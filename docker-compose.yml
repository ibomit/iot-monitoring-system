# Use postgres/example user/password credentials

services:

  postgres:
    image: postgres:17
    restart: always
    container_name: iot-monitoring-postgres
    # set shared memory limit when using docker compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_USER: iot_user
      POSTGRES_PASSWORD: iot_password
      POSTGRES_DB: iot_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    restart: always
    ports:
      - "127.0.0.1:8080:8080"

  # The services below are opt-in so the normal dev workflow (local uvicorn +
  # vite) keeps working: docker compose --profile app up -d --build
  backend:
    profiles: ["app"]
    build: ./backend
    restart: unless-stopped
    depends_on:
      - postgres
    # SECRET_KEY etc. come from backend/.env; DATABASE_URL is overridden below
    # because inside Compose the database host is "postgres", not localhost
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://iot_user:iot_password@postgres:5432/iot_db
      CORS_ORIGINS: http://localhost:8081
    ports:
      # All interfaces on purpose: the ESP32 reaches the API over the LAN
      - "8000:8000"

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8081:80"

volumes:
  postgres_data: